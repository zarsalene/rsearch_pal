# Builds an Android APK that you can install on a phone. Start it by hand (Actions > Android APK > Run workflow) or by a push that changes this file.
# The server address is the repository variable API_URL. If it is not set, the Render address below is used.
# For the sign-in with Supabase, set the repository variable SUPABASE_ANON_KEY (the public anon key).
name: Android APK

on:
  workflow_dispatch:
  # It also starts when this file or the app changes on a branch. The "Run workflow" button shows only for files on main.
  push:
    paths:
      - .github/workflows/android-apk.yml
      - research-pal/frontend/**

jobs:
  apk:
    name: Build the debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research-pal/frontend
    env:
      VITE_API_URL: ${{ vars.API_URL || 'https://research-pal-api.onrender.com' }}
      VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://iqqqearogsjtplheugsk.supabase.co' }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: research-pal/frontend/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx vite build
      - run: npx cap sync android
      - run: chmod +x android/gradlew
      - run: ./gradlew assembleDebug
        working-directory: research-pal/frontend/android
      - uses: actions/upload-artifact@v4
        with:
          name: research-pal-debug-apk
          path: research-pal/frontend/android/app/build/outputs/apk/debug/app-debug.apk
