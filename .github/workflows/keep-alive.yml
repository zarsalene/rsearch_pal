# Keeps the free Render server awake.
# Render free plan: the server sleeps after 15 minutes without a request. This job calls it every 10 minutes.
# GitHub can delay a scheduled run by a few minutes. 10 minutes leaves enough room.
# GitHub stops scheduled jobs in a repository with no activity for 60 days. A push (or "Run workflow") starts them again.
name: Keep the server awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HEALTH_URL: https://research-pal-api.onrender.com/api/health
    steps:
      - name: Call the health check
        run: |
          # A sleeping server needs up to one minute to wake up, so wait up to 90 seconds and try 3 times.
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -m 90 -w '%{http_code}' "$HEALTH_URL" || true)
            echo "try $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          echo "::warning::The server did not answer with HTTP 200. Check Render."
