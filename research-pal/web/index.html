<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#F6F6F7" />
    <script>
      // Set the theme before the first paint, so the page does not flash. theme.js has the same logic.
      (function () {
        try {
          var m = localStorage.getItem("rp-theme");
          var dark = m === "dark" || (m !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
          if (dark) document.querySelector('meta[name="theme-color"]').setAttribute("content", "#0B0B0E");
        } catch (e) {}
      })();
    </script>
    <title>Research Pal</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="description" content="Research Pal reads your research papers and fills a reading card. Every claim shows the quote and the page that prove it." />
    <meta property="og:title" content="Research Pal" />
    <meta property="og:description" content="Read less. Know where every claim comes from." />
    <meta property="og:image" content="/logo.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
