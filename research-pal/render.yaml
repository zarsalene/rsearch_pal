# Render settings for the backend.
# This repository has the app in the folder "research-pal/", so the root directory is "research-pal/backend".
# If Render does not find this file (it looks at the top of the repository), make the service by hand: New > Web Service,
# root directory "research-pal/backend", and copy the values below. See README.md.
services:
  - type: web
    name: research-pal-api
    runtime: python
    plan: free
    rootDir: research-pal/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_ORIGIN
        sync: false
      # Gemini is the default AI. If it gives an error, Groq answers. You can change both in the app (Settings > AI models).
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_FALLBACK
        value: groq
      # The free plan has 512 MB. The Gemini API makes the search vectors, so the server needs no local model.
      - key: EMBEDDING_BACKEND
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
